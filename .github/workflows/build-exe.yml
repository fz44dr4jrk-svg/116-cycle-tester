name: build-exe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build single-file EXE
        run: python build_exe.py
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: L16CycleTester-windows
          path: dist/L16CycleTester.exe
          retention-days: 30
      # macOS build is prepared but paused on request: add a macos-latest matrix
      # entry (artifact L16CycleTester-macos, path dist/L16CycleTester) to re-enable.
