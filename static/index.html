<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>L16 Cycle Tester</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="title-block">
    <h1>L16 Cycle Tester</h1>
    <div class="subtitle">Actuonics L16-50-35-6-R &middot; PhidgetAdvancedServo 8-Motor RCC0004_0</div>
  </div>
  <div class="header-right">
    <div class="pill-row">
      <div id="device-pill" class="pill">connecting&hellip;</div>
      <button type="button" id="btn-reconnect" class="reconnect-btn" hidden>RECONNECT CONTROLLER</button>
      <button type="button" id="btn-quit" class="quit-btn">QUIT APP</button>
    </div>
  </div>
</header>

<main>
  <section class="panel work-panel">
    <div class="status-row">
      <div id="status-pill" class="pill">IDLE</div>
      <div id="error-box" class="error" hidden></div>
    </div>

    <div class="counter">
      <div class="counter-label">Cycle count</div>
      <div class="counter-value"><span id="count">0</span><span class="counter-target"> / <span id="target">10,000</span></span></div>
      <div class="progress"><div id="progress-bar"></div></div>
    </div>

    <div class="slider-row">
      <label for="cycles">Number of cycles <output id="cycles-out"></output></label>
      <div class="control-line">
        <input type="range" id="cycles" min="0" max="78" step="1" value="0">
        <input type="number" id="cycles-num" min="10000" max="400000" step="5000" value="10000">
      </div>
    </div>
    <div class="slider-row">
      <label for="min">Position min <output id="min-out"></output></label>
      <div class="control-line">
        <input type="range" id="min" min="0" max="49" step="1" value="0">
        <input type="number" id="min-num" min="0" max="49" step="1" value="0">
      </div>
    </div>
    <div class="slider-row">
      <label for="max">Position max <output id="max-out"></output></label>
      <div class="control-line">
        <input type="range" id="max" min="1" max="50" step="1" value="50">
        <input type="number" id="max-num" min="1" max="50" step="1" value="50">
      </div>
    </div>
    <div class="slider-row">
      <label for="dwell">Interval between cycles <output id="dwell-out"></output></label>
      <div class="control-line">
        <input type="range" id="dwell" min="0" max="10" step="0.5" value="2">
        <input type="number" id="dwell-num" min="0" max="10" step="0.5" value="2">
      </div>
    </div>
    <div class="slider-row">
      <label for="voltage">Servo voltage <output id="voltage-out"></output></label>
      <div class="control-line">
        <input type="range" id="voltage" min="0" max="2" step="1" value="1">
      </div>
      <div class="volt-ticks"><span>5.0 V</span><span>6.0 V</span><span>7.4 V</span></div>
    </div>

    <div class="gauge-block">
      <div class="gauge-readout">Extent <span id="pos">0</span> mm &middot; range <span id="range-out">0 – 50 mm</span></div>
      <svg id="gauge" viewBox="0 0 560 100" preserveAspectRatio="xMidYMid meet" aria-label="movement extent gauge"></svg>
    </div>

    <div class="controls">
      <button type="button" id="btn-start" class="btn start">START</button>
      <button type="button" id="btn-stop" class="btn stop" disabled>STOP</button>
      <button type="button" id="btn-reset" class="btn reset">RESET</button>
    </div>
    <div id="settings-hint" class="hint">Settings apply when the tester is stopped.</div>
  </section>

  <section class="panel reserved-panel">
    <h2>Reserved</h2>
    <div class="reserved-note">The right half of the screen is reserved for future functions.</div>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
